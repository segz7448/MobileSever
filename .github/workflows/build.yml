name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Pre-compile RN Gradle Plugin
        run: |
          cd node_modules/@react-native/gradle-plugin
          chmod +x gradlew
          ./gradlew assemble --no-daemon 2>&1 | tail -5

      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res 2>&1
          SIZE=$(wc -c < android/app/src/main/assets/index.android.bundle)
          echo "Bundle: ${SIZE} bytes"
          [ "$SIZE" -lt 50000 ] && echo "Bundle too small!" && exit 1

      - name: Generate Keystores
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias mobilecloud -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobilecloud123 -keypass mobilecloud123 \
            -dname "CN=MobileCloud,OU=Dev,O=MobileCloud,L=US,ST=US,C=US"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: |
          cd android
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > ../gradle.log 2>&1
          CODE=$?
          set -e
          echo "=== Gradle exit: $CODE ==="
          echo "=== Kotlin errors ==="
          grep "^e: " ../gradle.log | head -20 || true
          echo "=== FAILURE block ==="
          grep -A 10 "FAILURE:" ../gradle.log | head -20 || true
          echo "=== Last 30 lines ==="
          tail -30 ../gradle.log
          if [ $CODE -ne 0 ]; then
            ERR=$(grep "^e: \|FAILURE:\|Exception" ../gradle.log | head -10 | tr '\n' ' ' | cut -c1-2000)
            echo "::error title=GradleError::${ERR}"
            exit 1
          fi
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Verify APK has JS bundle
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "::error::No APK found" && exit 1
          SIZE=$(wc -c < "$APK")
          echo "APK: $APK ($SIZE bytes)"
          [ "$SIZE" -lt 1000000 ] && echo "::error::APK too small: $SIZE bytes" && exit 1
          unzip -l "$APK" | grep -q "index.android.bundle" && echo "✓ JS bundle in APK" || { echo "::error::JS bundle MISSING from APK"; exit 1; }
          cp "$APK" MobileCloud.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileCloud-APK
          path: MobileCloud.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MobileCloud APK — Build ${{ github.run_number }}"
          body: |
            ## ☁ MobileCloud Android APK

            ### Install
            1. Download `MobileCloud.apk`
            2. Android → Settings → **Install unknown apps** → enable
            3. Open APK → Install → Launch MobileCloud

            Commit: ${{ github.sha }}
          files: MobileCloud.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
