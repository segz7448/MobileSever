name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK components
        run: |
          # ubuntu-latest has Android SDK pre-installed at $ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME: $ANDROID_HOME"
          # Accept all licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Install required SDK components
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393"

      - name: Bundle React Native JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          BUNDLE_SIZE=$(wc -c < android/app/src/main/assets/index.android.bundle)
          echo "✓ Bundle size: ${BUNDLE_SIZE} bytes"
          if [ "$BUNDLE_SIZE" -lt 10000 ]; then
            echo "ERROR: Bundle too small, likely failed"
            exit 1
          fi

      - name: Generate Keystores
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias mobilecloud -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobilecloud123 -keypass mobilecloud123 \
            -dname "CN=MobileCloud,OU=Dev,O=MobileCloud,L=US,ST=US,C=US"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -200
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Verify APK
        run: |
          echo "=== All APKs ==="
          find android -name "*.apk" -type f -exec ls -lh {} \;
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced"
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          echo "APK: $APK — ${SIZE} bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK too small (${SIZE} bytes) — not a real app"
            exit 1
          fi
          cp "$APK" MobileCloud-release.apk
          ls -lh MobileCloud-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileCloud-APK
          path: MobileCloud-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MobileCloud APK — Build ${{ github.run_number }}"
          body: |
            ## ☁ MobileCloud Android APK — Build ${{ github.run_number }}

            ### Install
            1. Download `MobileCloud-release.apk`
            2. Android → Settings → Security → **Install unknown apps** → enable
            3. Open the APK file → Install → Launch **MobileCloud**

            **Commit:** ${{ github.sha }}
          files: MobileCloud-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
