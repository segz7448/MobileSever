name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Pre-compile React Native Gradle Plugin
        run: |
          cd node_modules/@react-native/gradle-plugin
          chmod +x gradlew
          ./gradlew assemble --no-daemon 2>&1 | tail -5

      - name: Bundle JS (pre-build — guarantees bundle is in APK)
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          BSIZE=$(wc -c < android/app/src/main/assets/index.android.bundle)
          echo "✓ Bundle size: ${BSIZE} bytes"
          if [ "$BSIZE" -lt 50000 ]; then
            echo "::error title=BundleTooSmall::Bundle is ${BSIZE} bytes - likely failed"
            exit 1
          fi

      - name: Generate Keystores
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias mobilecloud -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobilecloud123 -keypass mobilecloud123 \
            -dname "CN=MobileCloud,OU=Dev,O=MobileCloud,L=US,ST=US,C=US"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          set +e
          ./gradlew assembleRelease --no-daemon --rerun-tasks --stacktrace > ../gradle_out.log 2>&1
          GRADLE_EXIT=$?
          set -e
          echo "=== EXIT: $GRADLE_EXIT ==="
          echo "=== KOTLIN ERRORS ==="
          grep "^e: \|error:" ../gradle_out.log | head -20
          echo "=== FAILURE ==="
          grep -A 10 "FAILURE:" ../gradle_out.log | head -15
          echo "=== LAST 20 LINES ==="
          tail -20 ../gradle_out.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            ERRS=$(grep "^e: \|FAILURE:\|Exception" ../gradle_out.log | head -15 | tr '\n' ' ' | cut -c1-2000)
            echo "::error title=BuildError::${ERRS}"
            exit 1
          fi
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Verify bundle is inside APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "::error ::No APK found" && exit 1
          echo "APK: $APK ($(wc -c < $APK) bytes)"
          # Check bundle is inside APK
          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "✓ JS bundle IS inside APK"
          else
            echo "::error title=NoBundleInAPK::JS bundle missing from APK - app will crash on launch"
            exit 1
          fi
          cp "$APK" MobileCloud-release.apk
          echo "✓ APK ready: $(ls -lh MobileCloud-release.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileCloud-APK
          path: MobileCloud-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MobileCloud APK — Build ${{ github.run_number }}"
          body: |
            ## ☁ MobileCloud Android APK

            ### Install
            1. Download `MobileCloud-release.apk` below
            2. Android → Settings → Security → **Install unknown apps** → enable
            3. Open the APK → Install → Launch **MobileCloud**

            **Commit:** ${{ github.sha }}
          files: MobileCloud-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
