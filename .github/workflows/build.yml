name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Generate Keystores
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias mobilecloud -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobilecloud123 -keypass mobilecloud123 \
            -dname "CN=MobileCloud,OU=Dev,O=MobileCloud,L=US,ST=US,C=US"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          set +e
          ./gradlew assembleRelease --no-daemon --rerun-tasks --stacktrace > ../gradle_out.log 2>&1
          GRADLE_EXIT=$?
          set -e
          echo "=== GRADLE EXIT: $GRADLE_EXIT ==="
          echo "=== FULL GRADLE OUTPUT ==="
          cat ../gradle_out.log
          echo "=== END GRADLE OUTPUT ==="
          if [ $GRADLE_EXIT -ne 0 ]; then
            ERRMSG=$(tail -60 ../gradle_out.log | tr '\n' ' ' | cut -c1-2000)
            echo "::error title=GradleError::${ERRMSG}"
            exit 1
          fi
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Find and Copy APK
        run: |
          echo "=== Searching for APKs ==="
          find android -name "*.apk" -type f | while read f; do
            echo "$f — $(wc -c < $f) bytes"
          done
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find android -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error title=NoAPK::No APK file found after successful Gradle build"
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          echo "APK: $APK — ${SIZE} bytes"
          [ "$SIZE" -lt 100000 ] && echo "::error title=APKTooSmall::${SIZE} bytes" && exit 1
          cp "$APK" MobileCloud-release.apk
          echo "✓ $(ls -lh MobileCloud-release.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileCloud-APK
          path: MobileCloud-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MobileCloud APK — Build ${{ github.run_number }}"
          body: |
            ## ☁ MobileCloud Android APK

            ### Install
            1. Download `MobileCloud-release.apk` below
            2. Android → Settings → Security → **Install unknown apps** → enable
            3. Open the APK → Install → Launch **MobileCloud**

            **Commit:** ${{ github.sha }}
          files: MobileCloud-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
