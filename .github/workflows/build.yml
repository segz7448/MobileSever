name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Bundle React Native JS
        run: |
          mkdir -p android/app/src/main/assets
          set +e
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            > bundle_stdout.log 2> bundle_stderr.log
          EXIT=$?
          set -e
          echo "=== STDOUT ===" && cat bundle_stdout.log
          echo "=== STDERR ===" && cat bundle_stderr.log
          if [ $EXIT -ne 0 ]; then
            echo "::error title=BundleError::$(cat bundle_stderr.log bundle_stdout.log | tail -30 | tr '\n' ' ')"
            exit 1
          fi
          BUNDLE_SIZE=$(wc -c < android/app/src/main/assets/index.android.bundle 2>/dev/null || echo 0)
          echo "✓ Bundle OK: ${BUNDLE_SIZE} bytes"

      - name: Upload bundle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-logs
          path: |
            bundle_stdout.log
            bundle_stderr.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Generate Keystores
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias mobilecloud -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobilecloud123 -keypass mobilecloud123 \
            -dname "CN=MobileCloud,OU=Dev,O=MobileCloud,L=US,ST=US,C=US"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log | tail -100
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Find and Copy APK
        run: |
          echo "=== All APK files ==="
          find android -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          APK=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found anywhere"
            find android -name "*.apk" 2>/dev/null || echo "Truly no APK"
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          echo "Found APK: $APK"
          echo "Size: ${SIZE} bytes ($(ls -lh $APK | awk '{print $5}'))"
          # Accept any APK larger than 100KB (real APK must have native libs)
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK suspiciously small: ${SIZE} bytes"
            exit 1
          fi
          cp "$APK" MobileCloud-release.apk
          echo "✓ APK ready: $(ls -lh MobileCloud-release.apk | awk '{print $5}')"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileCloud-APK
          path: MobileCloud-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MobileCloud APK — Build ${{ github.run_number }}"
          body: |
            ## ☁ MobileCloud Android APK

            ### Install
            1. Download `MobileCloud-release.apk` below
            2. Android → Settings → Security → **Install unknown apps** → enable
            3. Open the APK → Install → Launch **MobileCloud**

            **Commit:** ${{ github.sha }}
          files: MobileCloud-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
