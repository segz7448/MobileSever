name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Generate Keystores
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias mobilecloud -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobilecloud123 -keypass mobilecloud123 \
            -dname "CN=MobileCloud,OU=Dev,O=MobileCloud,L=US,ST=US,C=US"
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Release APK
        run: |
          # Let Gradle handle JS bundling automatically (RN 0.73 plugin does this)
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          echo "Exit: ${PIPESTATUS[0]}"
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
          NODE_ENV: production

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Find and Copy APK
        run: |
          echo "=== Searching ALL APK files ==="
          find android -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "  $f — $(wc -c < $f) bytes"
          done
          echo ""
          # Try release first, then any APK
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find android -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found. Gradle build may have failed silently."
            echo "=== Last 50 lines of gradle.log ==="
            tail -50 ../gradle.log 2>/dev/null || tail -50 gradle.log 2>/dev/null || echo "no gradle log"
            exit 1
          fi
          SIZE=$(wc -c < "$APK")
          echo "Found: $APK ($SIZE bytes)"
          [ "$SIZE" -lt 100000 ] && echo "ERROR: APK too small ($SIZE bytes)" && exit 1
          cp "$APK" MobileCloud-release.apk
          echo "✓ APK ready: $(ls -lh MobileCloud-release.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileCloud-APK
          path: MobileCloud-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MobileCloud APK — Build ${{ github.run_number }}"
          body: |
            ## ☁ MobileCloud Android APK

            ### Install
            1. Download `MobileCloud-release.apk` below
            2. Android → Settings → Security → **Install unknown apps** → enable
            3. Open the APK → Install → Launch **MobileCloud**

            **Commit:** ${{ github.sha }}
          files: MobileCloud-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
